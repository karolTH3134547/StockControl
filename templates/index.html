<h2>Control de Existencias</h2>
<p>Total: {{stats[0]}} | Stock: {{stats[1]}} | Valor: ${{stats[2]}}</p>
<a href="/agregar">+ Agregar Producto</a> | <a href="/logout">Salir</a>
<table border="1">
<tr><th>ID</th><th>Nombre</th><th>Cant</th><th>Venta</th><th>Acción</th></tr>
{% for p in productos %}
<tr>
<td>{{p[0]}}</td><td>{{p[1]}}</td><td>{{p[3]}}</td><td>{{p[5]}}</td>
<td><a href="/eliminar/{{p[0]}}">Eliminar</a></td>
</tr>
{% endfor %}
</table>
