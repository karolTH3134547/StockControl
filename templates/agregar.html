<h2>Agregar Producto</h2>
<form method="POST">
<input name="nombre" placeholder="Nombre" required>
<input name="categoria" placeholder="Categoría">
<input name="cantidad" type="number" placeholder="Cantidad" required>
<input name="p_compra" type="number" step="0.01" placeholder="Precio compra">
<input name="p_venta" type="number" step="0.01" placeholder="Precio venta">
<input name="proveedor" placeholder="Proveedor">
<button>Guardar</button>
</form>
<a href="/inicio">Volver</a>
